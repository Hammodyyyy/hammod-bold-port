<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- the site's one family: Archivo, condensed for display via the width axis -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Mirrors the site: pale grey canvas, ink, one electric-blue accent,
         condensed uppercase display type, small uppercase framing labels,
         and the work shots swung in 3D like the pinned work section. */
      :root {
        --bg: #ebebe8;
        --ink: #131313;
        --muted: #53555a;
        --faint: #686a70;
        --line: rgba(19, 19, 19, .14);
        --accent: #2f5bff;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: 'Archivo', sans-serif;
        position: relative;
      }

      /* framing labels, like the nav strip */
      .top {
        position: absolute; left: 56px; right: 56px; top: 40px;
        display: flex; justify-content: space-between; align-items: center;
        font-size: 15px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
      }
      .top .k { color: var(--faint); margin-right: 8px; }
      .top .v { color: var(--muted); text-transform: none; letter-spacing: 0; font-weight: 500; }
      .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; color: var(--ink); }
      .brand img { width: 34px; height: 34px; border-radius: 5px; }
      .status { display: flex; align-items: center; }
      .pip { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); margin-right: 10px; }

      .display {
        position: absolute; left: 52px;
        font-stretch: 62.5%; font-weight: 800; text-transform: uppercase;
        font-size: 168px; line-height: .86; letter-spacing: -.005em;
        white-space: nowrap;
      }
      .l1 { top: 104px; }
      .l2 { top: 380px; z-index: 3; }

      /* the work, as a 3D deck on the right */
      .deck { position: absolute; right: 46px; top: 112px; width: 396px; height: 223px; perspective: 1400px; }
      .shot {
        position: absolute; inset: 0;
        border-radius: 6px; overflow: hidden;
        box-shadow: 0 34px 70px -26px rgba(19, 19, 19, .55);
        transform-origin: 50% 50%;
      }
      .shot img { display: block; width: 100%; height: 100%; object-fit: cover; }
      .d1 { transform: translate(-58px, -2px) rotateY(18deg) rotateZ(-5deg) scale(.82); }
      .d2 { transform: translate(-30px, 2px) rotateY(14deg) rotateZ(-2.5deg) scale(.9); }
      .d3 { transform: translateX(14px) rotateY(-14deg) rotateZ(1.5deg); }

      .bottom {
        position: absolute; left: 56px; right: 56px; bottom: 40px;
        display: flex; justify-content: space-between; align-items: center;
        border-top: 2px solid var(--ink); padding-top: 18px;
      }
      .sub { font-size: 22px; color: var(--muted); }
      .tag {
        font-size: 17px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
        background: var(--accent); color: #fff; border-radius: 5px; padding: 12px 20px;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <span class="brand"><img src="../../public/avatars/hammody-avatar-96.webp" alt="" />Hammody</span>
      <span><span class="k">Role</span><span class="v">Roblox UI designer</span></span>
      <span class="status"><span class="pip"></span><span class="k">Status</span><span class="v">Open for projects</span></span>
    </div>

    <div class="display l1">Roblox UI,</div>

    <div class="deck">
      <div class="shot d1"><img src="../../public/work/kitchen-960.webp" alt="" /></div>
      <div class="shot d2"><img src="../../public/work/shop-960.webp" alt="" /></div>
      <div class="shot d3"><img src="../../public/work/quests-960.webp" alt="" /></div>
    </div>

    <div class="display l2">Built in Studio.</div>

    <div class="bottom">
      <span class="sub">Shops, HUDs, menus and full systems, delivered working inside Studio.</span>
      <span class="tag">hammody.me</span>
    </div>
  </body>
</html>
